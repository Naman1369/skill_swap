# Apache hardening for the SkillSwap container.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
</Directory>

# Internal folders and files are never served; denied requests show the normal 404 page.
<DirectoryMatch "^/var/www/html/(includes|database|uploads|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|md|sh|json|lock|ini|yml|yaml|conf)$|^Dockerfile$)">
    Require all denied
</FilesMatch>
ErrorDocument 403 /404.php
ErrorDocument 404 /404.php

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/json
</IfModule>

<IfModule mod_headers.c>
    <FilesMatch "\.(css|js|svg)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
</IfModule>
